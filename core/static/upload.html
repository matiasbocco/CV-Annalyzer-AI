<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Analyzer AI — Upload to Bank</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f2f5; color: #1a1a1a; min-height: 100vh; padding: 2rem 1rem; }
    h1  { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; }
    .container { max-width: 560px; margin: 0 auto; }
    .card { background: #fff; border-radius: 10px; padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 1.25rem; }
    label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: .4rem; color: #444; }
    input[type="file"] {
      display: block; width: 100%; padding: .5rem;
      border: 1.5px dashed #bbb; border-radius: 6px;
      background: #fafafa; cursor: pointer; font-size: .875rem;
    }
    .field { margin-bottom: 1.2rem; }
    button { width: 100%; padding: .7rem; background: #4f6ef7; color: #fff; font-size: 1rem; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: background .15s; }
    button:hover:not(:disabled) { background: #3a57e8; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }
    .status { font-size: .85rem; margin-top: .75rem; min-height: 1.25rem; color: #555; }
    .status.error { color: #c0392b; }
    /* summary grid */
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin-top: .5rem; }
    .stat-box { background: #f9fafb; border: 1.5px solid #e5e7eb; border-radius: 8px; padding: .9rem; text-align: center; }
    .stat-number { font-size: 1.75rem; font-weight: 800; line-height: 1.1; }
    .stat-label  { font-size: .78rem; color: #6b7280; margin-top: .2rem; text-transform: uppercase; letter-spacing: .04em; }
    .stat-added      .stat-number { color: #15803d; }
    .stat-duplicates .stat-number { color: #b45309; }
    .stat-failed     .stat-number { color: #dc2626; }
    .cv-ids { font-size: .8rem; color: #6b7280; margin-top: .75rem; word-break: break-all; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Upload CVs to Bank</h1>
    <p style="font-size:.9rem;color:#6b7280;margin-bottom:1.25rem">
      Add PDF CVs to the bank without running an analysis.
      Duplicates (same content, any filename) are automatically skipped.
    </p>

    <div class="card">
      <form id="form">
        <div class="field">
          <label for="files">CV Files (PDF)</label>
          <input id="files" type="file" name="files" accept=".pdf" multiple required />
        </div>
        <button id="btn" type="submit">Upload to bank</button>
        <p id="status" class="status"></p>
      </form>
    </div>

    <div id="results" style="display:none" class="card">
      <h2>Upload summary</h2>
      <div class="summary-grid">
        <div class="stat-box stat-added">
          <div class="stat-number" id="statAdded">0</div>
          <div class="stat-label">Added</div>
        </div>
        <div class="stat-box stat-duplicates">
          <div class="stat-number" id="statDups">0</div>
          <div class="stat-label">Skipped (dup)</div>
        </div>
        <div class="stat-box stat-failed">
          <div class="stat-number" id="statFailed">0</div>
          <div class="stat-label">Failed</div>
        </div>
      </div>
      <p id="cvIdsList" class="cv-ids"></p>
    </div>
  </div>

  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const files = document.getElementById('files').files;
      if (!files.length) { setStatus('Select at least one PDF.', true); return; }

      const formData = new FormData();
      for (const f of files) formData.append('files', f);

      setStatus(`Uploading ${files.length} file(s)…`);
      document.getElementById('btn').disabled = true;
      document.getElementById('results').style.display = 'none';

      try {
        const res  = await fetch('/cvs/batch', { method: 'POST', body: formData });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('statAdded').textContent  = data.added;
          document.getElementById('statDups').textContent   = data.duplicates;
          document.getElementById('statFailed').textContent = data.failed;
          const idsEl = document.getElementById('cvIdsList');
          if (data.cv_ids?.length) {
            idsEl.textContent = `CV IDs: ${data.cv_ids.join(', ')}`;
          } else {
            idsEl.textContent = '';
          }
          document.getElementById('results').style.display = 'block';
          setStatus(`${data.added} added, ${data.duplicates} skipped, ${data.failed} failed.`);
        } else {
          const detail = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
          setStatus(`Error ${res.status}: ${detail}`, true);
        }
      } catch (err) {
        setStatus(`Network error: ${err.message}`, true);
      } finally {
        document.getElementById('btn').disabled = false;
      }
    });

    function setStatus(msg, isError = false) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status' + (isError ? ' error' : '');
    }
  </script>
</body>
</html>
